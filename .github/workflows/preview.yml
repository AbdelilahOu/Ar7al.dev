name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.9"
          cache: "true"

      - name: Install dependencies
        run: bun install

      - name: Deploy preview
        id: deploy
        run: bun run deploy
        env:
          ALCHEMY_PREVIEW_ID: pr-${{ github.event.pull_request.number }}
          SECRET_PASSPHRASE: ${{ secrets.SECRET_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ALCHEMY_CI_STATE_STORE_CHECK: "false"

      - name: Comment preview links
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- pr-preview-urls -->";
            const webUrl = `${{ steps.deploy.outputs.web_url }}`;
            const serverUrl = `${{ steps.deploy.outputs.server_url }}`;
            const body = [
              marker,
              "### Preview deployed",
              "",
              `- Web: ${webUrl}`,
              `- API: ${serverUrl}`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.9"
          cache: "true"

      - name: Install dependencies
        run: bun install

      - name: Destroy preview
        run: bun run destroy
        env:
          ALCHEMY_PREVIEW_ID: pr-${{ github.event.pull_request.number }}
          SECRET_PASSPHRASE: ${{ secrets.SECRET_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ALCHEMY_CI_STATE_STORE_CHECK: "false"
