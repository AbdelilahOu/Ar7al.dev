<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: var(--low);
      }

      [data-tone="dark"] {
        --low: #0a0a0a;
        --high: #8a877f;
        --ring: rgba(255, 255, 255, 0.12);
        --shadow: rgba(0, 0, 0, 0.7);
      }

      [data-tone="light"] {
        --low: #f3f2ee;
        --high: #1c1b19;
        --ring: rgba(0, 0, 0, 0.18);
        --shadow: rgba(0, 0, 0, 0.35);
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      .frame {
        position: absolute;
        left: {{PADDING}}px;
        top: {{PADDING}}px;
        width: {{CONTENT_WIDTH}}px;
        height: {{CONTENT_HEIGHT}}px;
        border-radius: {{RADIUS}}px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px var(--ring),
          0 28px 56px -16px var(--shadow);
      }

      .frame img {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body data-tone="{{TONE}}" data-cell="{{CELL}}" data-seed="{{SEED}}">
    <canvas></canvas>
    <div class="frame">
      <img src="{{IMAGE}}" alt="" />
    </div>
    <script>
      const { cell, seed } = document.body.dataset;
      const size = Number(cell);
      const style = getComputedStyle(document.body);
      const low = hex(style.getPropertyValue("--low"));
      const high = hex(style.getPropertyValue("--high"));

      const canvas = document.querySelector("canvas");
      const cols = Math.ceil({{WIDTH}} / size);
      const rows = Math.ceil({{HEIGHT}} / size);
      canvas.width = cols;
      canvas.height = rows;

      const random = mulberry32(Number(seed));
      const blobs = Array.from({ length: 6 }, () => ({
        x: random(),
        y: random(),
        r: 0.2 + random() * 0.35,
        w: 0.45 + random() * 0.55,
      }));
      const aspect = cols / rows;

      function field(x, y) {
        let value = 0.12 * (x + y);
        for (const blob of blobs) {
          const dx = (x - blob.x) * aspect;
          const dy = y - blob.y;
          value += blob.w * Math.exp(-(dx * dx + dy * dy) / (blob.r * blob.r));
        }
        return Math.min(0.92, Math.max(0, value * 0.55));
      }

      const bayer = [
        [0, 32, 8, 40, 2, 34, 10, 42],
        [48, 16, 56, 24, 50, 18, 58, 26],
        [12, 44, 4, 36, 14, 46, 6, 38],
        [60, 28, 52, 20, 62, 30, 54, 22],
        [3, 35, 11, 43, 1, 33, 9, 41],
        [51, 19, 59, 27, 49, 17, 57, 25],
        [15, 47, 7, 39, 13, 45, 5, 37],
        [63, 31, 55, 23, 61, 29, 53, 21],
      ];

      const context = canvas.getContext("2d");
      const pixels = context.createImageData(cols, rows);
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const value = field(col / cols, row / rows);
          const mix = value > (bayer[row % 8][col % 8] + 0.5) / 64 ? 1 : 0;
          const index = (row * cols + col) * 4;
          const color = mix ? high : low;
          for (let channel = 0; channel < 3; channel++) {
            pixels.data[index + channel] = color[channel];
          }
          pixels.data[index + 3] = 255;
        }
      }
      context.putImageData(pixels, 0, 0);

      function hex(value) {
        const clean = value.trim().replace("#", "");
        return [0, 2, 4].map((offset) => parseInt(clean.slice(offset, offset + 2), 16));
      }

      function mulberry32(state) {
        return () => {
          state |= 0;
          state = (state + 0x6d2b79f5) | 0;
          let t = Math.imul(state ^ (state >>> 15), 1 | state);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
    </script>
  </body>
</html>
