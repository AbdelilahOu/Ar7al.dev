<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%sveltekit.status% - Abdelilah Ouaadouch</title>
    <meta name="robots" content="noindex" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        background-color: #0a0a0a;
        color: #f5f3ee;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .container {
        max-width: 32rem;
        width: 100%;
        text-align: center;
      }
      .error-box {
        background-color: #141414;
        padding: 2rem;
      }
      h1 {
        font-size: 4rem;
        font-weight: 700;
        line-height: 1;
      }
      .message {
        margin-top: 1rem;
        font-size: 1.125rem;
        color: #a5a29a;
      }
      .log {
        margin-top: 1.5rem;
        color: #a5a29a;
      }
      .log-cmd {
        font-size: 0.875rem;
      }
      .log-cmd span {
        color: #f87171;
      }
      .log-msg {
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: #6e6c66;
      }
      .home-link {
        display: inline-block;
        margin-top: 1.5rem;
        background-color: #141414;
        padding: 0.75rem 1.5rem;
        color: #f5f3ee;
        text-decoration: none;
        transition: background-color 0.2s;
      }
      .home-link:hover {
        background-color: #1c1c1c;
      }
      .home-link span {
        color: #4ade80;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-box">
        <h1>%sveltekit.status%</h1>
        <p class="message">%sveltekit.error.message%</p>
      </div>
      <div class="log">
        <p class="log-cmd"><span>$</span> cat ./error.log</p>
        <p class="log-msg">Error: %sveltekit.error.message%</p>
      </div>
      <a href="/" class="home-link"> <span>$</span> cd ~ </a>
    </div>
  </body>
</html>
