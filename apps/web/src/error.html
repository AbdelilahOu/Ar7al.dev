<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%sveltekit.status% - Abdelilah Ouaadouch</title>
    <meta name="robots" content="noindex" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background-color: #0a0a0a;
        color: #f5f3ee;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      main {
        width: 100%;
        max-width: 48rem;
      }
      .label {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #6e6c66;
      }
      h1 {
        margin-top: 1rem;
        font-size: clamp(4rem, 14vw, 6rem);
        font-weight: 400;
        line-height: 1;
      }
      .message {
        margin-top: 1.25rem;
        font-size: 1.125rem;
        line-height: 1.6;
        color: #a5a29a;
      }
      nav {
        margin-top: 2.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid #2a2a28;
        font-size: 0.875rem;
      }
      a {
        color: #a5a29a;
        text-decoration: underline;
        text-decoration-color: #2a2a28;
        text-underline-offset: 4px;
        transition:
          color 150ms,
          text-decoration-color 150ms;
      }
      a:hover {
        color: #f5f3ee;
        text-decoration-color: #6e6c66;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Error</p>
      <h1>%sveltekit.status%</h1>
      <p class="message">%sveltekit.error.message%</p>
      <nav>
        <a href="/">&larr; Back to home</a>
      </nav>
    </main>
  </body>
</html>
